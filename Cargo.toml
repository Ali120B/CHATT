[workspace]
members = [
  "crates/protocol",
  "crates/database",
  "crates/app-core",
  "crates/identity",
  "crates/crypto",
  "crates/transport",
  "crates/coordinator",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/example/chat"

[workspace.dependencies]
anyhow = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
strip = true
