name: Release
# Push a tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build the
# Linux AppImage (x64) and Windows setup.exe (x64) and attach both to ONE
# GitHub draft release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }} # both runners are x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Hearth ${{ github.ref_name }}"
          releaseBody: "Draft build — see the release notes before publishing."
          releaseDraft: true
          prerelease: false
